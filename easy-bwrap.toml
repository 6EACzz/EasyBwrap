# ==============================================================================
# EasyBwrap 配置文件模板 (easy-bwrap.toml)
#
# 配置加载逻辑:
#   1. 环境变量 EASY_BWRAP_CONF 指定的路径
#   2. 脚本所在目录下的 easy-bwrap.toml
#   3. 脚本所在目录下的 run-sandbox.toml
#
# 配置继承与覆盖优先级 (由低到高):
#   [defaults] 全局默认 < extends 继承预设 < [presets.*] 当前预设 < --override 命令行覆盖
# ==============================================================================

# ------------------------------------------------------------------------------
# 全局常规选项
# ------------------------------------------------------------------------------
[general]
# 未指定程序/预设时的默认启动预设名称
default = "shell"

# 默认编辑器 (用于打开或查看配置文件)
editor = "nano"

# 安全检查开关 (防止将系统关键目录或裸家目录误挂载入沙箱)
security = true

# 沙箱运行态基准目录 (存放临时 socket、虚拟家目录、代理进程 PID 等)
state_dir = "/tmp/easy-bwrap-state"

# systemd-run 瞬态作用域集成模式:
#   "auto" : 自动探测是否处于 systemd 会话中，支持则接入，否则平滑降级
#   "on"   : 强制启用 (若探测失败则报错终止)
#   "off"  : 显式禁用 systemd 集成
systemd = "auto"

# systemd 用户 slice 组名 (将沙箱进程归类到指定的 slice 单元下)
slice = "app.slice"

# 挂载黑名单: 命中以下规则的宿主目录严禁挂载为读写 (加 ':exact' 表示仅精确匹配本身，子目录不受限)
blocklist = [
  "/",
  "/etc",
  "/usr",
  "/opt",
  "/sys",
  "/dev",
  "/run",
  "/proc",
  "~:exact",
  "~/.ssh",
]

# 全局 D-Bus 代理模式:
#   "off"    : 默认隔离 D-Bus，不暴露宿主总线
#   "proxy"  : 通过 xdg-dbus-proxy 进行精细过滤直通
#   "direct" : 直接暴露宿主 session bus (不安全，仅用于特殊兼容场景)
dbus = "off"

# 全局 D-Bus 白名单规则 (当 dbus = "proxy" 时生效)
# 格式: "接口名[:策略]"，策略可选 talk (默认) | own | see
dbus_whitelist = [
  "org.freedesktop.portal.*:talk",
  "org.fcitx.Fcitx5:talk",
]

# ------------------------------------------------------------------------------
# 全局默认特性开关 [defaults]
# 所有预设均以此为基础基线，各预设可单独覆盖指定开关
# ------------------------------------------------------------------------------
[defaults]
# 系统只读基础挂载 (/usr, /etc, /sys, /proc 等系统关键目录)
base = true

# 图形驱动设备节点直通 (/dev/dri/card*, /dev/dri/renderD*)
gpu_dri = true

# NVIDIA 专有驱动设备节点直通 (/dev/nvidia*)
gpu_nv = false

# 独立内存临时文件系统 (为 /tmp 和 /run 分配隔离的 tmpfs)
tmpfs = true

# 共享内存 (/dev/shm 挂载，大型图形/浏览器程序按需开启)
shm = false

# 工作目录绑定 (将宿主当前工作目录绑定至沙箱内相同路径)
pwd = false

# 网络隔离模式:
#   "isolated" : (推荐) 基于 pasta 的独立用户态网络，彻底防御 X11 抽象套接字逃逸
#   "shared"   : 共享宿主网络命名空间
#   "off"      : 完全断开网络连接 (禁用网络命名空间或回环)
net = "isolated"

# 终端会话伪终端隔离 (彻底免疫沙箱内 TIOCSTI 字符注入逃逸)
vtty = false

# Wayland 图形显示服务直通
wayland = false

# PipeWire 音频服务直通
pipewire = false

# 独立 X11 隔离会话 (在 Wayland 环境下自动启动 xwayland-satellite，分配独立 display)
# 注意: 启用 x11 必须同时启用 wayland (wayland = true)
x11 = false

# 虚拟独立家目录 (在沙箱临时状态目录下自动创建并绑定到用户 $HOME，隔离宿主家目录文件)
vhome = false

# Seccomp 系统调用过滤 (启用后默认加载 [seccomp.default] 规则并即时编译为 BPF)
seccomp = true

# ------------------------------------------------------------------------------
# 预设定义: [presets.<预设名称>]
#
# 配置项速查:
#   program          = "程序路径"         # 必填(或继承): 可执行文件绝对路径 (支持 ~ 展开)
#   alias            = "别名"             # 选填: 快捷调用别名 (不被 extends 继承)
#   extends          = "父预设名称"       # 选填: 继承基础预设的属性
#   net              = "isolated"|"shared"|"off"
#   dbus             = "off"|"proxy"|"direct"
#   dbus_whitelist   = ["名称[:策略]"]   # 接口策略: :talk (默认) | :own | :see
#   seccomp          = true|false|"规则名" # 指定引用的 [seccomp] 规则集
#   systemd          = "auto"|"on"|"off" # 覆盖 systemd 集成行为
#   memory_max       = "4G"              # Cgroup v2 内存硬限制
#   memory_high      = "3G"              # Cgroup v2 内存节流水位线
#   cpu_quota        = "200%"            # Cgroup v2 CPU 配额 (200% 表示最多使用 2 核)
#   tasks_max        = 500               # Cgroup v2 进程/线程数上限
#   io_weight        = 100               # Cgroup v2 IO 权重 (1..10000)
#   setenv           = { K = "V" }       # 环境变量注入
#   bind             = [                 # 文件系统挂载规则列表
#     "src[:dst][:mode]"                 # mode 可选: rw(默认) | ro | create | rw-try | ro-try
#   ]
# ------------------------------------------------------------------------------

# 1. 基础命令行交互终端 (隔离环境，安全探索或编译运行)
[presets.shell]
program = "/usr/bin/bash"
alias = "sh"
pwd = true                               # 绑定宿主当前执行目录
vhome = true                             # 启用虚拟家目录，不污染宿主 ~
setenv = { BWRAP_SANDBOX = "1" }
bind = [
  "~/.bashrc:ro-try",
  "~/.inputrc:ro-try",
]

# 2. Zsh 终端 (继承自 shell)
[presets.zsh]
extends = "shell"
program = "/usr/bin/zsh"
bind = [
  "~/.zshrc:ro-try",
  "~/.config/fontconfig:ro-try",
]

# 3. 开发编译沙箱 (挂载常用开发缓存与 git 配置)
[presets.dev]
extends = "shell"
pwd = true
bind = [
  "~/.gitconfig:ro-try",
  "~/.cache:rw-try",
  "~/.cargo:rw-try",
]
setenv = { CARGO_HOME = "~/.cargo" }

# 4. 现代桌面 GUI 应用模板 (以 Firefox 为例)
[presets.browser]
program = "/usr/bin/firefox"
alias = "web"
wayland = true                           # 直通 Wayland 显示协议
pipewire = true                          # 直通 PipeWire 声音通道
gpu_dri = true                           # 直通 DRI 硬件加速
shm = true                               # 开启 /dev/shm 内存共享
dbus = "proxy"                           # 启用 D-Bus 代理过滤
dbus_whitelist = [
  "org.freedesktop.portal.*:talk",       # 桌面门户 (文件选择、弹窗等)
  "org.fcitx.Fcitx5:talk",               # 输入法框架
]
seccomp = "browser"                      # 浏览器专用 Seccomp 规则 (放行 user namespace)
memory_max = "4G"                        # 内存硬限制 4GB
cpu_quota = "200%"                       # 最多占用 2 颗 CPU 核心
bind = [
  "~/.mozilla:create",
  "~/Downloads:rw-try",
]

# 5. 多媒体播放器模板 (以 mpv 为例，演示 MPRIS 控制直通)
[presets.media-player]
program = "/usr/bin/mpv"
wayland = true
pipewire = true
gpu_dri = true
dbus = "proxy"
dbus_whitelist = [
  "org.mpris.MediaPlayer2.*:own",        # 允许播放器注册 MPRIS 媒体控制接口
  "org.freedesktop.portal.*:talk",
]
bind = [
  "~/Videos:ro-try",
  "~/Music:ro-try",
]

# 6. 游戏与兼容运行环境 (X11 隔离 + 32 位兼容支持)
[presets.game-compat]
program = "/usr/bin/steam"
wayland = true
x11 = true                               # 开启隔离 X11 支持
shm = true                               # 共享内存
gpu_dri = true
gpu_nv = true                            # 若为 NVIDIA 显卡直通相关设备
net = "shared"                           # 游戏网络低延迟共享
seccomp = "gaming"                       # 放行 32 位兼容调用架构 (compat32)
bind = [
  "~/.local/share/Steam:create",
]

# ==============================================================================
# 系统调用安全过滤配置集: [seccomp]
#
# 引擎会在沙箱启动时依据规则 DSL 即时编译为 BPF 字节码，并按哈希缓存。
# 规则 DSL 语法:
#   default allow|deny|errno <CODE>|kill|log   (设置默认过滤动作)
#   allow|deny|kill|log <syscall...>           (指定系统调用列表执行该动作)
#   errno <CODE> <syscall...>                  (返回指定错误码，如 EPERM, ENOSYS)
#   tiocsti                                    (拦截 ioctl(TIOCSTI) 终端伪造注入)
#   compat32                                   (放行 32 位 x86 系统调用架构)
# ==============================================================================
[seccomp]
# 默认加固规则: 封禁内核提权、命名空间逃逸、内核模块与密钥篡改等敏感系统调用
default = """
default allow
tiocsti
deny mount umount2 pivot_root chroot
deny open_by_handle_at name_to_handle_at
deny unshare setns
deny init_module finit_module delete_module
deny reboot swapon swapoff kexec_load kexec_file_load
deny bpf perf_event_open userfaultfd syslog
deny ptrace process_vm_readv process_vm_writev
deny keyctl add_key request_key
"""

# 浏览器/Electron 规则: 允许内部沙箱创建 user namespace (放行 unshare)
browser = """
default allow
tiocsti
deny mount umount2 pivot_root
deny setns
deny open_by_handle_at name_to_handle_at
deny init_module finit_module delete_module
deny reboot swapon swapoff kexec_load kexec_file_load
deny bpf perf_event_open userfaultfd syslog
deny ptrace process_vm_readv process_vm_writev
deny keyctl add_key request_key
"""

# 游戏兼容规则: 允许 32 位系统调用 (compat32)
gaming = """
default allow
tiocsti
compat32
deny mount umount2 pivot_root
deny open_by_handle_at name_to_handle_at
deny init_module finit_module delete_module
deny reboot swapon swapoff kexec_load kexec_file_load
deny bpf perf_event_open userfaultfd syslog
deny ptrace process_vm_readv process_vm_writev
deny keyctl add_key request_key
"""

